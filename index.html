<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoodTunes - AI Powered Music Companion</title>
    <meta name="description" content="Engage in dynamic AI-driven conversations and receive personalized Spotify music recommendations based on your mood." />
    
    <!-- CSS Styles -->
    <link rel="stylesheet" href="/public/style.css" />
  </head>

  <body>
    <!-- Background Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <div class="app-container">
      <!-- Sidebar Navigation -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="brand-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18V5l12-2v13M9 9l12-2M6 18a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm12 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
            </svg>
            <span>MoodTunes</span>
          </div>
          <button class="btn-icon" id="sidebarToggle" title="Collapse Sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
        </div>

        <button class="new-chat-btn" onclick="location.reload()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>New Chat</span>
        </button>

        <div class="history-section">
          <div class="history-section-title">Recent Conversations</div>
          <div id="historyList">
            <div class="history-item active">Current Mood Session</div>
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="spotify-status-card">
            <span>Spotify Connected</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="10" />
            </svg>
          </div>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main class="main-workspace">
        <!-- Top Navbar -->
        <header class="top-nav">
          <div class="nav-left">
            <span class="mood-badge" id="moodBadge">Mood: NEUTRAL</span>
          </div>
        </header>

        <!-- Chat Scroll View -->
        <div class="chat-container" id="chatContainer">
          <!-- Messages or Empty State dynamically injected here -->
        </div>

        <!-- Chat Input Bar -->
        <div class="input-container">
          <div class="input-box">
            <input
              type="text"
              id="chatInput"
              class="chat-input"
              placeholder="Tell MoodTunes how you feel or what mood you want..."
              autocomplete="off"
            />
            <button class="btn-send" onclick="handleSendMessage()" title="Send Message">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Bottom Music Player Drawer -->
        <div class="player-drawer">
          <div class="player-track">
            <img id="playerTrackArt" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=100&h=100&fit=crop" class="track-art" style="width:40px;height:40px;" />
            <div class="track-info">
              <div class="track-title" id="playerTrackTitle">No track selected</div>
              <div class="track-artist" id="playerTrackArtist">Select a track to play preview</div>
            </div>
          </div>

          <div class="player-controls">
            <div class="player-btns">
              <button class="btn-icon" id="playPauseBtn" onclick="togglePlayPause()">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7z" />
                </svg>
              </button>
            </div>
            <div class="progress-bar-wrap">
              <div class="progress-bar-fill" id="playerProgressFill"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- JavaScript Bundle -->
    <script src="/public/app.js"></script>
  </body>
</html>
